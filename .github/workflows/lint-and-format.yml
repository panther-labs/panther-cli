name: Lint, Format, and Test

on:
  pull_request:
    branches: [ '**' ]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: golangci-lint run
        uses: golangci/golangci-lint-action@7fe1b22e0c4632d6260fedfafd4b6025ac7418c3
        with:
          args: --timeout 10m --verbose --allow-parallel-runners --max-same-issues 0 --max-issues-per-linter 0

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          gofumpt -l .
          # If gofumpt finds files that need formatting, it will list them
          # We want to check if any files were listed and fail if so
          if [ "$(gofumpt -l .)" != "" ]; then
            echo "The following files need formatting with gofumpt:"
            gofumpt -l .
            echo "::error::Code formatting issues found. Please run 'gofumpt -l -w .' locally to fix."
            exit 1
          fi

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: Run tests
        run: go test -v ./pkg/...
        env:
          CGO_ENABLED: 0