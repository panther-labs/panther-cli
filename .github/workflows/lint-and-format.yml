name: Lint, Format, and Test

on:
  pull_request:
    branches: [ '**' ]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: golangci-lint run
        uses: golangci/golangci-lint-action@c2427fec7902bf2304ba21394dce2ed2f2a6cb2c
        with:
          args: --timeout 10m --verbose --allow-parallel-runners --max-same-issues 0 --max-issues-per-linter 0

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          gofumpt -l .
          # If gofumpt finds files that need formatting, it will list them
          # We want to check if any files were listed and fail if so
          if [ "$(gofumpt -l .)" != "" ]; then
            echo "The following files need formatting with gofumpt:"
            gofumpt -l .
            echo "::error::Code formatting issues found. Please run 'gofumpt -l -w .' locally to fix."
            exit 1
          fi

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: Run tests
        run: go test -v ./pkg/...