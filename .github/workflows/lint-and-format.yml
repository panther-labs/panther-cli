name: Lint, Format, and Test

on:
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: golangci-lint run
        uses: golangci/golangci-lint-action@e52a9f899623adbdb986c05b9a8f7a8cf4138fc3
        with:
          args: --timeout 10m --verbose --allow-parallel-runners --max-same-issues 0 --max-issues-per-linter 0

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          gofumpt -l .
          # If gofumpt finds files that need formatting, it will list them
          # We want to check if any files were listed and fail if so
          if [ "$(gofumpt -l .)" != "" ]; then
            echo "The following files need formatting with gofumpt:"
            gofumpt -l .
            echo "::error::Code formatting issues found. Please run 'gofumpt -l -w .' locally to fix."
            exit 1
          fi

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '>=1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: Run tests
        run: go test -v ./pkg/...
        env:
          CGO_ENABLED: 0
