name: Lint, Format, and Test

on:
  pull_request:
    branches: [ '**' ]

jobs:
  lint-format-test:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Go mod download
        run: go mod download

      - name: Run linting
        run: golangci-lint run --out-format=github-actions

      - name: Check formatting
        run: |
          gofumpt -l .
          # If gofumpt finds files that need formatting, it will list them
          # We want to check if any files were listed and fail if so
          if [ "$(gofumpt -l .)" != "" ]; then
            echo "The following files need formatting with gofumpt:"
            gofumpt -l .
            echo "::error::Code formatting issues found. Please run 'gofumpt -l -w .' locally to fix."
            exit 1
          fi

      - name: Run tests
        run: go test -v ./pkg/...