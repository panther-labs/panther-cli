name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - cmd/**
      - pkg/**
      - go.mod
      - go.sum
      - .goreleaser.yaml
  workflow_dispatch:


permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write # for creating PR in homebrew-taps

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }} #expose value to other jobs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '>=1.24'
          cache: true

      - name: Install dependencies
        run: |
          go mod download

      - name: Run tests
        run: go test -v ./pkg/...

      - name: golangci-lint run
        uses: golangci/golangci-lint-action@2c963d3543d699fc1331bd69134fcd9f7f4efc4e
        with:
          args: --timeout 10m --verbose --allow-parallel-runners --max-same-issues 0 --max-issues-per-linter 0

      - name: Create release tag if not exists
        id: create_tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Explicitly fetch all tags from the remote
          git fetch --tags --force

          # Get latest tag or use v0.0.0 if none exists
          LATEST_TAG=$(git tag -l | grep "^v" | sort -V | tail -n 1 || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Increment patch version
          MAJOR=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1/')
          MINOR=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\2/')
          PATCH=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\3/')
          PATCH=$((PATCH + 1))

          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "Creating new tag: $NEW_TAG"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a $NEW_TAG -m "Release $NEW_TAG"

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Push tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: git push origin $NEW_TAG

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@4c34bd9582ccc4c70b13604961aa0f7de30b28d4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release tag for homebrew
        id: release_tag
        run: |
          # Use create_tag output when we created the tag (push to main),
          # otherwise use the ref we're running on (tag push). Exposed as job output release_tag.
          if [ -n "${{ steps.create_tag.outputs.tag }}" ]; then
            echo "tag=${{ steps.create_tag.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi