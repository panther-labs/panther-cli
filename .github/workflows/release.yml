name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - cmd/**
      - pkg/**
      - go.mod
      - go.sum
      - .goreleaser.yaml
  workflow_dispatch:


permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }} # expose value to other jobs
    steps:
      - name: Checkout # zizmor: ignore[artipacked] workflow needs credentials to push tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '>=1.24'
          cache: true # zizmor: ignore[cache-poisoning] all triggers require write access

      - name: Install dependencies
        run: |
          go mod download

      - name: Run tests
        run: go test -v ./pkg/...

      - name: golangci-lint run
        uses: golangci/golangci-lint-action@f8208ee75bbfe589bb30d9a5f8646f8df0f1bca3
        with:
          args: --timeout 10m --verbose --allow-parallel-runners --max-same-issues 0 --max-issues-per-linter 0

      - name: Create release tag if not exists
        id: create_tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Explicitly fetch all tags from the remote
          git fetch --tags --force

          # Get latest tag or use v0.0.0 if none exists
          LATEST_TAG=$(git tag -l | grep "^v" | sort -V | tail -n 1 || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Increment patch version
          MAJOR=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1/')
          MINOR=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\2/')
          PATCH=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\3/')
          PATCH=$((PATCH + 1))

          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "Creating new tag: $NEW_TAG"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a $NEW_TAG -m "Release $NEW_TAG"

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Push tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: git push origin $NEW_TAG

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@dcd4e58dba1e1db1877d8f2906f41405180c642a
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release tag for homebrew
        id: release_tag
        env:
          CREATE_TAG: ${{ steps.create_tag.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Use create_tag output when we created the tag (push to main),
          # otherwise use the ref we're running on (tag push). Exposed as job output release_tag.
          if [ -n "${CREATE_TAG}" ]; then
            echo "tag=${CREATE_TAG}" >> $GITHUB_OUTPUT
          else
            echo "tag=${REF_NAME}" >> $GITHUB_OUTPUT
          fi

  homebrew-taps-pr:  # Opens a PR in homebrew-taps to update the panther-cli formula after a release
    name: Homebrew Taps PR
    runs-on: macos-latest # So util/update-formula.sh (sed -i '') works without changing the script
    needs: release
    permissions: {}
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: Iv23lie716nKFq0B7AyL
          private-key: ${{ secrets.PANTHER_BOT_APP_PRIVATE_KEY }}
          owner: panther-labs
          repositories: homebrew-taps
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout homebrew-taps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: panther-labs/homebrew-taps
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-taps
          persist-credentials: false

      # Homebrew script expects version without leading "v" (e.g. 0.0.29). ${RELEASE_TAG#v} strips the "v"
      - name: Update formula
        working-directory: homebrew-taps
        run: ./util/update-formula.sh "${RELEASE_TAG#v}"

      - name: Create Homebrew formula PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-taps
          base: main
          branch: update-panther-cli-${{ env.RELEASE_TAG }}
          commit-message: Update panther-cli to ${{ env.RELEASE_TAG }}
          title: Update panther-cli to ${{ env.RELEASE_TAG }}
          body: Automated update from panther-cli release workflow
          sign-commits: true
